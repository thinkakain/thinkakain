<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level 6 · Thinkakain</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header id="tower-header"></header>

<div class="meter" id="meter">
  <div class="meter-label">Proximity</div>
  <div class="meter-word" id="meter-word">Freezing</div>
  <div class="meter-bar"><div class="meter-fill" id="meter-fill"></div></div>
</div>

<main id="level-main" class="level-main">

  <section class="puzzle-card">
    <p>Somewhere below, the tower buried a word.</p>
    <p class="muted">Scroll. The meter knows how close you are.</p>
  </section>

  <div class="deep" id="deep">
    <div class="depth-code" id="depth-code"></div>
  </div>

  <section class="puzzle-card">
    <p class="muted">Found it? Enter it below.</p>
  </section>

  <div id="hint-slot"></div>
  <div id="passcode-slot" class="sticky-bottom"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js?v=2"></script>
<script src="../js/backend.js"></script>
<script src="../js/engine.js"></script>
<script>
(function () {
  "use strict";

  // The buried word sits at 82% of the scrollable page and is injected
  // from the server — the page source contains no answers. Temperature
  // is the player's normalized distance to that target; "BOILING"
  // (within ~1.2% of total scroll) fades the word in.
  async function boot() {
    var ok = await Thinkakain.initLevel({ level: 6, title: "Hot and Cold" });
    if (!ok) return;

    var clues = await Thinkakain.clues(6).catch(function () { return {}; });
    document.getElementById("depth-code").textContent = clues.buried_word || "";

    var meterWord = document.getElementById("meter-word");
    var meterFill = document.getElementById("meter-fill");
    var codeEl = document.getElementById("depth-code");
    var max = 0, target = 0;

    function measure() {
      max = document.documentElement.scrollHeight - window.innerHeight;
      target = max * 0.82;
    }

    function onScroll() {
      var y = window.scrollY || window.pageYOffset;
      var d = max > 0 ? Math.abs(y - target) / max : 1;
      var label, color;
      if (d <= 0.012)      { label = "BOILING";  color = "#e5484d"; codeEl.classList.add("revealed"); }
      else if (d <= 0.05)  { label = "Hot";      color = "#f2a93b"; }
      else if (d <= 0.12)  { label = "Warm";     color = "#e8c15a"; }
      else if (d <= 0.25)  { label = "Cold";     color = "#4da3ff"; }
      else                 { label = "Freezing"; color = "#4da3ff"; }
      meterWord.textContent = label;
      meterWord.style.color = color;
      meterFill.style.width = Math.max(0, 100 - d * 280) + "%";
      meterFill.style.background = color;
    }

    var ticking = false;
    window.addEventListener("scroll", function () {
      if (!ticking) {
        ticking = true;
        requestAnimationFrame(function () { onScroll(); ticking = false; });
      }
    }, { passive: true });
    window.addEventListener("resize", function () { measure(); onScroll(); });

    measure();
    onScroll();

    Thinkakain.hints("hint-slot", [
      "Boiling means you're standing right on it.",
      "About four-fifths of the way down."
    ]);

    Thinkakain.mountPasscode(6, {
      successFlavor: "The depths yield.",
      wrongMessage: "Read the word the meter led you to — letter by letter."
    });
  }
  boot();
})();
</script>
</body>
</html>
