<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level 3 · Thinkakain</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header id="tower-header"></header>

<main id="level-main" class="level-main">

  <section class="puzzle-card">
    <p>This level was painted black, and the painter hid one word in the dark.</p>
    <p class="muted">Not everything is as dark as it seems. Bring up the light.</p>
    <canvas id="dark"></canvas>
    <div class="slider-row">
      <label for="brightness">Brightness</label>
      <input type="range" id="brightness" min="0" max="100" value="0" step="1">
    </div>
  </section>

  <div id="hint-slot"></div>
  <div id="passcode-slot"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js?v=2"></script>
<script src="../js/backend.js"></script>
<script src="../js/engine.js"></script>
<script>
(function () {
  "use strict";

  // The hidden word is drawn on every frame but at near-zero alpha; the
  // slider raises the text alpha so the word emerges from the black.
  // The word itself arrives from the server (page source has no answers).
  async function boot() {
    var ok = await Thinkakain.initLevel({ level: 3, title: "Out of the Dark" });
    if (!ok) return;

    var clues = await Thinkakain.clues(3).catch(function () { return {}; });
    var hiddenWord = clues.hidden_word || "";

    var cv = document.getElementById("dark");
    var cx = cv.getContext("2d");
    var slider = document.getElementById("brightness");

    function paint(v) {
      var w = cv.clientWidth, h = cv.clientHeight;
      var g = cx.createLinearGradient(0, 0, w, h);
      g.addColorStop(0, "#05070d");
      g.addColorStop(1, "#0b1020");
      cx.fillStyle = g;
      cx.fillRect(0, 0, w, h);
      if (!hiddenWord) return;
      var alpha = 0.03 + (v / 100) * 0.9; // 0.03 = invisible, ~0.93 = clear
      cx.fillStyle = "rgba(240,244,255," + alpha.toFixed(3) + ")";
      cx.font = "700 64px -apple-system, 'Segoe UI', Roboto, sans-serif";
      cx.textAlign = "center";
      cx.textBaseline = "middle";
      cx.fillText(hiddenWord, w / 2, h / 2);
    }

    function fit() {
      var dpr = window.devicePixelRatio || 1;
      cv.width = cv.clientWidth * dpr;
      cv.height = cv.clientHeight * dpr;
      cx.setTransform(dpr, 0, 0, dpr, 0, 0);
      paint(Number(slider.value));
    }

    slider.addEventListener("input", function () { paint(Number(slider.value)); });
    window.addEventListener("resize", fit);
    fit();

    Thinkakain.hints("hint-slot", [
      "The word is there at every brightness — just too faint to see.",
      "Drag the slider all the way up."
    ]);

    Thinkakain.mountPasscode(3, {
      successFlavor: "You found it in the dark.",
      wrongMessage: "Read the word the light reveals — letter by letter."
    });
  }
  boot();
})();
</script>
</body>
</html>
