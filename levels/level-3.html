<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level 3 · Thinkakain</title>
<link rel="stylesheet" href="../css/style.css?v=14">
</head>
<body>

<header id="tower-header"></header>

<main id="level-main" class="level-main">
  <section class="puzzle-card">
    <div id="eq-row" class="eq-row" role="group" aria-label="equation"></div>
    <div id="tile-bank" class="tile-bank" role="group" aria-label="tiles"></div>
    <div id="eq-msg" class="eq-msg"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js?v=2"></script>
<script src="../js/backend.js"></script>
<script src="../js/engine.js"></script>
<script>
(function () {
  "use strict";

  // Slot 0 ("8") and slot 3 ("=") are prefilled and locked.
  var FIXED = { 0: "8", 3: "=" };
  // Bank tiles: display glyph + value sent to the server.
  var TILES = [
    { d: "6", v: "6" }, { d: "×", v: "x" },
    { d: "3", v: "3" }, { d: "−", v: "-" },
    { d: "7", v: "7" }, { d: "4", v: "4" },
    { d: "+", v: "+" }, { d: "3", v: "3" }
  ];

  var slots = new Array(10).fill(null); // tile index, or -1 for fixed
  slots[0] = -1;
  slots[3] = -1;

  var rowEl = document.getElementById("eq-row");
  var bankEl = document.getElementById("tile-bank");
  var msgEl = document.getElementById("eq-msg");
  var busy = false;

  function slotValue(i) {
    if (slots[i] === -1) return FIXED[i];
    if (slots[i] === null) return null;
    return TILES[slots[i]].v;
  }

  function render() {
    rowEl.innerHTML = "";
    for (var i = 0; i < 10; i++) {
      (function (idx) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "eq-box";
        if (slots[idx] === -1) {
          b.classList.add("fixed");
          b.textContent = FIXED[idx];
          b.disabled = true;
        } else if (slots[idx] !== null) {
          b.classList.add("filled");
          b.textContent = TILES[slots[idx]].d;
          b.setAttribute("aria-label", "remove tile");
          b.addEventListener("click", function () {
            if (busy) return;
            slots[idx] = null;
            msgEl.textContent = "";
            render();
          });
        } else {
          b.classList.add("empty");
          b.setAttribute("aria-label", "empty slot");
        }
        rowEl.appendChild(b);
      })(i);
    }

    bankEl.innerHTML = "";
    var placed = {};
    slots.forEach(function (s) { if (s !== null && s !== -1) placed[s] = true; });
    TILES.forEach(function (t, ti) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "tile" + (placed[ti] ? " used" : "");
      b.textContent = t.d;
      b.disabled = !!placed[ti];
      b.setAttribute("aria-label", "tile " + t.d);
      b.addEventListener("click", function () {
        if (busy || placed[ti]) return;
        for (var i = 0; i < 10; i++) {
          if (slots[i] === null) { slots[i] = ti; break; }
        }
        msgEl.textContent = "";
        render();
        maybeSubmit();
      });
      bankEl.appendChild(b);
    });
  }

  function isFull() {
    for (var i = 0; i < 10; i++) if (slots[i] === null) return false;
    return true;
  }

  function maybeSubmit() {
    if (!isFull() || busy) return;
    busy = true;
    var expr = "";
    for (var i = 0; i < 10; i++) expr += slotValue(i);
    Thinkakain.submitEquation(3, expr).then(function (res) {
      busy = false;
      if (res && res.correct) {
        Thinkakain.onSolved("The numbers balance.");
      } else {
        msgEl.textContent = "That doesn't add up.";
        rowEl.classList.remove("shake");
        void rowEl.offsetWidth;
        rowEl.classList.add("shake");
      }
    }).catch(function (err) {
      busy = false;
      msgEl.textContent = window.Backend.friendlyError(err);
    });
  }

  async function boot() {
    var ok = await Thinkakain.initLevel({ level: 3 });
    if (!ok) return;
    render();
  }
  boot();
})();
</script>
</body>
</html>
