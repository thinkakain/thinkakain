<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level 15 · Thinkakain</title>
<link rel="stylesheet" href="../css/style.css?v=14">
</head>
<body>

<header id="tower-header"></header>

<main id="level-main" class="level-main">
  <section class="puzzle-card">
    <audio controls src="../assets/audio.mp3" class="audio-player"></audio>
    <a href="../assets/audio.mp3" download class="dl-btn">Download</a>
  </section>
  <div id="passcode-slot"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js?v=2"></script>
<script src="../js/backend.js"></script>
<script src="../js/engine.js"></script>
<script>
(function () {
  "use strict";
  async function boot() {
    var ok = await Thinkakain.initLevel({ level: 15 });
    if (!ok) return;
    Thinkakain.mountPasscode(15, {
      normalize: function (s) { return s.replace(/\s+/g, ""); },
      successFlavor: "Now you hear it.",
      wrongMessage: "Not quite. Try again."
    });
  }
  boot();
})();
</script>
</body>
</html>
