<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level 11 · Thinkakain</title>
<link rel="stylesheet" href="../css/style.css?v=11">
</head>
<body>

<header id="tower-header"></header>

<main id="level-main" class="level-main">
  <section class="puzzle-card">
    <div class="arrow-wrap">
      <svg viewBox="0 0 260 120" class="arrow-svg">
        <path d="M 10 60 L 70 10 L 70 42 L 250 42 L 250 78 L 70 78 L 70 110 Z"
              fill="#ffffff" stroke="#1a2e3a" stroke-width="6" stroke-linejoin="round"/>
        <text x="160" y="70" text-anchor="middle"
              font-family="ui-monospace, Menlo, Consolas, monospace"
              font-size="32" font-weight="700" fill="#1a2e3a" letter-spacing="6">DJOGY</text>
      </svg>
    </div>
  </section>
  <div id="passcode-slot"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js?v=2"></script>
<script src="../js/backend.js"></script>
<script src="../js/engine.js"></script>
<script>
(function () {
  "use strict";
  async function boot() {
    var ok = await Thinkakain.initLevel({ level: 11 });
    if (!ok) return;
    Thinkakain.mountPasscode(11, {
      successFlavor: "Shift happens.",
      wrongMessage: "Not quite. Try again."
    });
  }
  boot();
})();
</script>
</body>
</html>
