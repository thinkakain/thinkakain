<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Z = A · Thinkakain</title>
<link rel="stylesheet" href="../css/style.css?v=9">
</head>
<body>

<header id="tower-header"></header>

<main id="level-main" class="level-main">
  <section class="puzzle-card">
    <div class="morse" aria-label="signal">
      <span class="mdash"></span><span class="mdash"></span><span class="mdot"></span><span class="mgap"></span><span class="mdot"></span><span class="mdot"></span><span class="mdot"></span><span class="mgap"></span><span class="mdot"></span><span class="mdot"></span><span class="mdot"></span><span class="mdash"></span><span class="mwordgap"></span><span class="mdash"></span><span class="mdot"></span><span class="mdot"></span><span class="mdash"></span><span class="mgap"></span><span class="mdot"></span><span class="mdash"></span><span class="mdot"></span><span class="mdot"></span><span class="mgap"></span><span class="mdot"></span><span class="mdash"></span><span class="mdash"></span><span class="mgap"></span><span class="mdot"></span><span class="mdot"></span><span class="mdot"></span><span class="mdash"></span>
    </div>
  </section>
  <div id="passcode-slot"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js?v=2"></script>
<script src="../js/backend.js"></script>
<script src="../js/engine.js"></script>
<script>
(function () {
  "use strict";
  async function boot() {
    var ok = await Thinkakain.initLevel({ level: 20 });
    if (!ok) return;
    Thinkakain.mountPasscode(20, {
      successFlavor: "You cracked it.",
      wrongMessage: "Not quite. Try again."
    });
  }
  boot();
})();
</script>
</body>
</html>
