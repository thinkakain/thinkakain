<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level 25 · Thinkakain</title>
<link rel="stylesheet" href="../css/style.css?v=19">
</head>
<body>

<header id="tower-header"></header>

<main id="level-main" class="level-main">
  <section class="puzzle-card zoom-card">
    <div class="zoom-stage" id="zoomStage">
      <img class="zoom-img" id="zoomImg" src="../assets/level-25.png" alt="" draggable="false">
    </div>
  </section>
  <div id="passcode-slot"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js?v=2"></script>
<script src="../js/backend.js"></script>
<script src="../js/engine.js"></script>
<script>
(function () {
  "use strict";
  var stage = document.getElementById("zoomStage");
  var img = document.getElementById("zoomImg");
  var IW = 1280, IH = 880;
  // Fixed magnification — no zoom in or out. The player drags to pan
  // across the mosaic and reads it section by section.
  var SCALE = 1.6;
  var tx = 0, ty = 0;
  // Opens on colourful noise with white fragments at the edges:
  // the gap between the O's, over the empty rows between the lines.
  var FOCUS_X = 620, FOCUS_Y = 420;

  function clampT() {
    var w = IW * SCALE, h = IH * SCALE;
    var sw = stage.clientWidth, sh = stage.clientHeight;
    if (w <= sw) tx = (sw - w) / 2;
    else tx = Math.min(0, Math.max(sw - w, tx));
    if (h <= sh) ty = (sh - h) / 2;
    else ty = Math.min(0, Math.max(sh - h, ty));
  }
  function apply() {
    clampT();
    img.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + SCALE + ")";
  }
  function toStart() {
    tx = stage.clientWidth / 2 - FOCUS_X * SCALE;
    ty = stage.clientHeight / 2 - FOCUS_Y * SCALE;
    apply();
  }

  var dragId = null, lastX = 0, lastY = 0;
  stage.addEventListener("pointerdown", function (e) {
    if (dragId !== null) return;
    dragId = e.pointerId;
    lastX = e.clientX; lastY = e.clientY;
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener("pointermove", function (e) {
    if (e.pointerId !== dragId) return;
    tx += e.clientX - lastX;
    ty += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    apply();
  });
  function endDrag(e) { if (e.pointerId === dragId) dragId = null; }
  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", endDrag);

  async function boot() {
    var ok = await Thinkakain.initLevel({ level: 25 });
    if (!ok) return;
    toStart();
    Thinkakain.mountPasscode(25, {
      successFlavor: "Piece by piece.",
      wrongMessage: "Not quite. Try again."
    });
  }
  if (img.complete) boot(); else img.addEventListener("load", boot);
})();
</script>
</body>
</html>
