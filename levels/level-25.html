<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level 25 · Thinkakain</title>
<link rel="stylesheet" href="../css/style.css?v=19">
</head>
<body>

<header id="tower-header"></header>

<main id="level-main" class="level-main">
  <section class="puzzle-card zoom-card">
    <div class="zoom-stage" id="zoomStage">
      <img class="zoom-img" id="zoomImg" src="../assets/level-25.png" alt="" draggable="false">
    </div>
  </section>
  <div id="passcode-slot"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js?v=2"></script>
<script src="../js/backend.js"></script>
<script src="../js/engine.js"></script>
<script>
(function () {
  "use strict";
  var stage = document.getElementById("zoomStage");
  var img = document.getElementById("zoomImg");
  var IW = 1280, IH = 880;
  var scale = 3, tx = 0, ty = 0, fitScale = 0.3;
  // Opens cropped on an abstract patch: the gap between the two O's of
  // line 1 and the empty rows beneath (cells ~35,21 of 20px each).
  var FOCUS_X = 700, FOCUS_Y = 430, START_SCALE = 3;

  function clampT() {
    var w = IW * scale, h = IH * scale;
    var sw = stage.clientWidth, sh = stage.clientHeight;
    if (w <= sw) tx = (sw - w) / 2;
    else tx = Math.min(0, Math.max(sw - w, tx));
    if (h <= sh) ty = (sh - h) / 2;
    else ty = Math.min(0, Math.max(sh - h, ty));
  }
  function apply() {
    clampT();
    img.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + scale + ")";
  }
  function toFit() {
    fitScale = Math.min(stage.clientWidth / IW, stage.clientHeight / IH);
    scale = fitScale;
    tx = (stage.clientWidth - IW * scale) / 2;
    ty = (stage.clientHeight - IH * scale) / 2;
    apply();
  }
  function toStart() {
    scale = START_SCALE;
    tx = stage.clientWidth / 2 - FOCUS_X * scale;
    ty = stage.clientHeight / 2 - FOCUS_Y * scale;
    apply();
  }
  function zoomAt(cx, cy, factor) {
    var ns = Math.min(START_SCALE * 1.6, Math.max(fitScale, scale * factor));
    var k = ns / scale;
    tx = cx - (cx - tx) * k;
    ty = cy - (cy - ty) * k;
    scale = ns;
    apply();
  }

  var pointers = new Map();
  var lastDist = 0, lastTap = 0;
  stage.addEventListener("pointerdown", function (e) {
    stage.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      var p = Array.from(pointers.values());
      lastDist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
    }
  });
  stage.addEventListener("pointermove", function (e) {
    if (!pointers.has(e.pointerId)) return;
    var prev = pointers.get(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      tx += e.clientX - prev.x;
      ty += e.clientY - prev.y;
      apply();
    } else if (pointers.size === 2) {
      var p = Array.from(pointers.values());
      var d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      var rect = stage.getBoundingClientRect();
      var mx = (p[0].x + p[1].x) / 2 - rect.left;
      var my = (p[0].y + p[1].y) / 2 - rect.top;
      if (lastDist > 0) zoomAt(mx, my, d / lastDist);
      lastDist = d;
    }
  });
  function endPointer(e) {
    pointers.delete(e.pointerId);
    lastDist = 0;
  }
  stage.addEventListener("pointerup", function (e) {
    endPointer(e);
    var now = Date.now();
    if (now - lastTap < 320) {
      if (scale > fitScale * 1.15) toFit(); else toStart();
      lastTap = 0;
    } else lastTap = now;
  });
  stage.addEventListener("pointercancel", endPointer);
  stage.addEventListener("wheel", function (e) {
    e.preventDefault();
    var rect = stage.getBoundingClientRect();
    zoomAt(e.clientX - rect.left, e.clientY - rect.top, Math.exp(-e.deltaY * 0.0015));
  }, { passive: false });
  stage.addEventListener("dblclick", function () {
    if (scale > fitScale * 1.15) toFit(); else toStart();
  });

  async function boot() {
    var ok = await Thinkakain.initLevel({ level: 25 });
    if (!ok) return;
    fitScale = Math.min(stage.clientWidth / IW, stage.clientHeight / IH);
    toStart();
    Thinkakain.mountPasscode(25, {
      successFlavor: "The bigger picture.",
      wrongMessage: "Not quite. Try again."
    });
  }
  if (img.complete) boot(); else img.addEventListener("load", boot);
})();
</script>
</body>
</html>
