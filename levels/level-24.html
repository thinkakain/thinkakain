<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level 24 · Thinkakain</title>
<link rel="stylesheet" href="../css/style.css?v=19">
</head>
<body>

<header id="tower-header"></header>

<main id="level-main" class="level-main">
  <section class="puzzle-card abcd-card">
    <div class="abcd-grid">
      <input class="abcd-box" id="inA" inputmode="numeric" maxlength="1" placeholder="A">
      <input class="abcd-box" id="inB" inputmode="numeric" maxlength="1" placeholder="B">
      <span class="abcd-opcell">× 3</span>
      <span class="abcd-eq">=</span>
      <span class="abcd-digit" id="p1d1">·</span>
      <span class="abcd-digit" id="p1d2">·</span>
      <span class="abcd-digit" id="p1d3">·</span>
      <span></span><span></span><span></span>

      <span></span><span></span><span></span><span></span>
      <span class="abcd-sym">+</span>
      <span class="abcd-sym">+</span>
      <span class="abcd-sym">+</span>
      <span></span><span></span><span></span>

      <span class="abcd-fixed">7</span>
      <input class="abcd-box" id="inC" inputmode="numeric" maxlength="1" placeholder="C">
      <span class="abcd-opcell abcd-opflex">× <input class="abcd-box abcd-box-d" id="inD" inputmode="numeric" maxlength="1" placeholder="D"></span>
      <span class="abcd-eq">=</span>
      <span class="abcd-digit" id="p2d1">·</span>
      <span class="abcd-digit" id="p2d2">·</span>
      <span class="abcd-digit" id="p2d3">·</span>
      <span></span><span></span><span></span>

      <span></span><span></span><span></span><span></span>
      <span class="abcd-sym">↓</span>
      <span class="abcd-sym">↓</span>
      <span class="abcd-sym">↓</span>
      <span></span><span></span><span></span>

      <span></span><span></span><span></span><span></span>
      <span class="abcd-sums">
        <span class="abcd-digit abcd-digit-sm" id="cs1">·</span>+
        <span class="abcd-digit abcd-digit-sm" id="cs2">·</span>+
        <span class="abcd-digit abcd-digit-sm" id="cs3">·</span>
      </span>
      <span class="abcd-eq">=</span>
      <span class="abcd-digit" id="tD">·</span>
      <span class="abcd-digit">1</span>
    </div>
    <div class="abcd-hint">A, B, C, D are different digits.</div>
    <button class="btn" id="abcdGo">Check</button>
    <div class="abcd-msg" id="abcdMsg"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js?v=2"></script>
<script src="../js/backend.js"></script>
<script src="../js/engine.js"></script>
<script>
(function () {
  "use strict";
  function dig(id) {
    var v = document.getElementById(id).value.replace(/\D/g, "").slice(0, 1);
    return v === "" ? null : parseInt(v, 10);
  }
  function setCells(ids, s) {
    for (var i = 0; i < 3; i++) document.getElementById(ids[i]).textContent = s[i];
  }
  function refresh() {
    var A = dig("inA"), B = dig("inB"), C = dig("inC"), D = dig("inD");
    var v = null, w = null;
    if (A !== null && B !== null) {
      v = (10*A+B)*3;
      if (v > 999) setCells(["p1d1","p1d2","p1d3"], "✕✕✕");
      else setCells(["p1d1","p1d2","p1d3"], String(v).padStart(3, "·"));
    } else setCells(["p1d1","p1d2","p1d3"], "···");
    if (C !== null && D !== null) {
      w = (70+C)*D;
      if (w > 999) setCells(["p2d1","p2d2","p2d3"], "✕✕✕");
      else setCells(["p2d1","p2d2","p2d3"], String(w).padStart(3, "0"));
    } else setCells(["p2d1","p2d2","p2d3"], "···");
    document.getElementById("tD").textContent = D === null ? "·" : String(D);
    if (v === null || w === null || v < 100 || v > 999 || w > 999) {
      setCells(["cs1","cs2","cs3"], "···");
      return;
    }
    var s1 = String(v), s2 = String(w).padStart(3, "0");
    document.getElementById("cs1").textContent = +s1[0] + +s2[0];
    document.getElementById("cs2").textContent = +s1[1] + +s2[1];
    document.getElementById("cs3").textContent = +s1[2] + +s2[2];
  }
  async function boot() {
    var ok = await Thinkakain.initLevel({ level: 24 });
    if (!ok) return;
    ["inA","inB","inC","inD"].forEach(function(id){
      document.getElementById(id).addEventListener("input", refresh);
    });
    refresh();
    document.getElementById("abcdGo").addEventListener("click", async function(){
      var A=dig("inA"),B=dig("inB"),C=dig("inC"),D=dig("inD");
      var msg = document.getElementById("abcdMsg");
      if (A===null||B===null||C===null||D===null) { msg.textContent = "Fill all four digits."; return; }
      msg.textContent = "Checking…";
      try {
        var r = await Thinkakain.submitAbcd(24, A, B, C, D);
        if (r && r.correct) { Thinkakain.onSolved("Every column adds up."); }
        else { msg.textContent = "Not quite. Try again."; }
      } catch(e) { msg.textContent = "Check failed. Try again."; }
    });
  }
  boot();
})();
</script>
</body>
</html>
