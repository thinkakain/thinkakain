<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level 24 · Thinkakain</title>
<link rel="stylesheet" href="../css/style.css?v=18">
</head>
<body>

<header id="tower-header"></header>

<main id="level-main" class="level-main">
  <section class="puzzle-card abcd-card">
    <div class="abcd-row">
      <input class="abcd-box" id="inA" inputmode="numeric" maxlength="1" placeholder="A">
      <input class="abcd-box" id="inB" inputmode="numeric" maxlength="1" placeholder="B">
      <span class="abcd-op">× 3</span>
      <span class="abcd-eq">=</span>
      <span class="abcd-out" id="outP1">···</span>
    </div>
    <div class="abcd-plus">+</div>
    <div class="abcd-row">
      <span class="abcd-fixed">7</span>
      <input class="abcd-box" id="inC" inputmode="numeric" maxlength="1" placeholder="C">
      <span class="abcd-op">×</span>
      <input class="abcd-box" id="inD" inputmode="numeric" maxlength="1" placeholder="D">
      <span class="abcd-eq">=</span>
      <span class="abcd-out" id="outP2">···</span>
    </div>
    <div class="abcd-arrow">↓</div>
    <div class="abcd-row abcd-sum">
      <span class="abcd-out" id="outC1">·</span>
      <span class="abcd-op">+</span>
      <span class="abcd-out" id="outC2">·</span>
      <span class="abcd-op">+</span>
      <span class="abcd-out" id="outC3">·</span>
      <span class="abcd-eq">=</span>
      <span class="abcd-out" id="outT">···</span>
    </div>
    <div class="abcd-hint">A, B, C, D are different digits.</div>
    <button class="btn" id="abcdGo">Check</button>
    <div class="abcd-msg" id="abcdMsg"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js?v=2"></script>
<script src="../js/backend.js"></script>
<script src="../js/engine.js"></script>
<script>
(function () {
  "use strict";
  function dig(id) {
    var v = document.getElementById(id).value.replace(/\D/g, "").slice(0, 1);
    return v === "" ? null : parseInt(v, 10);
  }
  function refresh() {
    var A = dig("inA"), B = dig("inB"), C = dig("inC"), D = dig("inD");
    var p1 = document.getElementById("outP1");
    var p2 = document.getElementById("outP2");
    if (A === null || B === null) { p1.textContent = "···"; }
    else {
      var v = (10*A+B)*3;
      p1.textContent = (v < 100 || v > 999) ? "✕" : String(v);
    }
    if (C === null || D === null) { p2.textContent = "···"; }
    else {
      var w = (70+C)*D;
      p2.textContent = w > 999 ? "✕" : String(w).padStart(3, "0");
    }
    // column sums
    var c1 = document.getElementById("outC1"),
        c2 = document.getElementById("outC2"),
        c3 = document.getElementById("outC3"),
        tt = document.getElementById("outT");
    if (A===null||B===null||C===null||D===null) {
      c1.textContent=c2.textContent=c3.textContent="·"; tt.textContent="···"; return;
    }
    var s1 = String((10*A+B)*3).padStart(3,"0"),
        s2 = String((70+C)*D).padStart(3,"0");
    var k1 = +s1[0] + +s2[0], k2 = +s1[1] + +s2[1], k3 = +s1[2] + +s2[2];
    c1.textContent = k1; c2.textContent = k2; c3.textContent = k3;
    tt.textContent = String(D) + "1 → " + (k1+k2+k3);
  }
  async function boot() {
    var ok = await Thinkakain.initLevel({ level: 24 });
    if (!ok) return;
    ["inA","inB","inC","inD"].forEach(function(id){
      document.getElementById(id).addEventListener("input", refresh);
    });
    refresh();
    document.getElementById("abcdGo").addEventListener("click", async function(){
      var A=dig("inA"),B=dig("inB"),C=dig("inC"),D=dig("inD");
      var msg = document.getElementById("abcdMsg");
      if (A===null||B===null||C===null||D===null) { msg.textContent = "Fill all four digits."; return; }
      msg.textContent = "Checking…";
      try {
        var r = await Thinkakain.submitAbcd(24, A, B, C, D);
        if (r && r.correct) { Thinkakain.onSolved("Every column adds up."); }
        else { msg.textContent = "Not quite. Try again."; }
      } catch(e) { msg.textContent = "Check failed. Try again."; }
    });
  }
  boot();
})();
</script>
</body>
</html>
