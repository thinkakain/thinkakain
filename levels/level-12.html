<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level 12 · Thinkakain</title>
<link rel="stylesheet" href="../css/style.css?v=9">
</head>
<body>

<header id="tower-header"></header>

<main id="level-main" class="level-main">
  <section class="puzzle-card">
    <div class="code-text flip-y">FLIP</div>
  </section>
  <div id="passcode-slot"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js?v=2"></script>
<script src="../js/backend.js"></script>
<script src="../js/engine.js"></script>
<script>
(function () {
  "use strict";
  async function boot() {
    var ok = await Thinkakain.initLevel({ level: 12 });
    if (!ok) return;
    Thinkakain.mountPasscode(12, {
      successFlavor: "Turn that around.",
      wrongMessage: "Not quite. Try again."
    });
  }
  boot();
})();
</script>
</body>
</html>
