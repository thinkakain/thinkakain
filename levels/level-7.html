<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level 7 · Overthink</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header id="tower-header"></header>

<main id="level-main" class="level-main">

  <section class="puzzle-card">
    <!-- The story arrives pre-woven from the server: its hidden message
         is encoded in zero-width characters (U+200B = 0, U+200C = 1,
         5 bits per A-Z letter). The page source contains no answers. -->
    <p class="story" id="story"></p>
    <p class="muted" style="margin-top:14px">Copy the story above. There is more <b>between the letters</b> than in them.</p>

    <div class="decoder-box">
      <textarea id="decoder-input" placeholder="Paste the story here, then decode…"></textarea>
      <div class="decoder-row">
        <button type="button" class="btn btn-ghost" id="use-story-btn">Use the story above</button>
        <button type="button" class="btn" id="decode-btn">Decode</button>
      </div>
      <div class="decoder-output" id="decoder-output"></div>
    </div>
  </section>

  <div id="hint-slot"></div>
  <div id="passcode-slot"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/backend.js"></script>
<script src="../js/engine.js"></script>
<script>
(function () {
  "use strict";

  // Zero-width codec (escapes keep this file plain ASCII):
  // U+200B = bit 0, U+200C = bit 1, 5 bits per A-Z letter.
  var ZW0 = "\u200B";
  var ZW1 = "\u200C";

  function zwExtract(s) {
    var out = "";
    for (var i = 0; i < s.length; i++) {
      var c = s.charAt(i);
      if (c === ZW0 || c === ZW1) out += c;
    }
    return out;
  }

  function zwDecodeBits(bits) {
    var out = "";
    for (var i = 0; i + 5 <= bits.length; i += 5) {
      var chunk = bits.substr(i, 5).split("").map(function (c) {
        return c === ZW1 ? "1" : "0";
      }).join("");
      var v = parseInt(chunk, 2);
      if (v >= 0 && v < 26) out += String.fromCharCode(65 + v);
    }
    return out;
  }

  async function boot() {
    var ok = await Overthink.initLevel({ level: 7, title: "Between the Letters" });
    if (!ok) return;

    var storyEl = document.getElementById("story");
    var clues = await Overthink.clues(7).catch(function () { return {}; });
    // textContent (not innerHTML): the payload carries invisible
    // characters, never markup.
    storyEl.textContent = clues.story_html || "";

    document.getElementById("use-story-btn").addEventListener("click", function () {
      document.getElementById("decoder-input").value = storyEl.textContent;
    });

    document.getElementById("decode-btn").addEventListener("click", function () {
      var pasted = document.getElementById("decoder-input").value;
      var bits = zwExtract(pasted);
      var res = document.getElementById("decoder-output");
      if (!bits) {
        res.textContent = "Nothing hidden found in that text.";
        return;
      }
      res.textContent = "Hidden message: " + zwDecodeBits(bits);
    });

    Overthink.hints("hint-slot", [
      "Copy the story. There is more between the letters than in them.",
      "Paste it into the decoder below — or use the button that does it for you."
    ]);

    Overthink.mountPasscode(7, {
      successFlavor: "You heard the whisper.",
      wrongMessage: "Decode the hidden message first — then enter exactly what it says."
    });
  }
  boot();
})();
</script>
</body>
</html>
