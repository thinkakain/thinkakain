<!DOCTYPE html>
<!-- ============================================================
     THINKAKAIN — level template.
     Copy this file to level-1.html, level-2.html, ... and:
       1. Set the <title> and the initLevel options below
          (level number, title).
       2. Build your puzzle inside <main id="level-main">.
       3. IMPORTANT: never put answers, durations, or sequences
          in client code. Add the secrets to supabase/seed.sql
          (git-ignored) and fetch any public display data via
          Thinkakain.clues(level).
       4. Wire your puzzle JS at the bottom:
            passcode level -> Thinkakain.mountPasscode(level, {...})
            hold level     -> Thinkakain.submitHold(level, ms)
            sequence level -> Thinkakain.submitSequence(level, ids)
            then Thinkakain.onSolved("flavor text")
       5. Bump BUILT_LEVELS in js/engine.js AND the BUILT constant
          in index.html so the grid and Next button pick it up.
     Design rule: no explanatory text, no hint buttons. The clue
     lives in the page itself — the player figures out the rest.
     ============================================================ -->
