<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level 5 · Thinkakain</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header id="tower-header"></header>

<main id="level-main" class="level-main">

  <section class="puzzle-card">
    <!-- Five lights. Tapping one toggles it and its neighbours.
         Turn them all off. No words needed. -->
    <div class="tiles-row" id="tiles"></div>
  </section>

  <div id="passcode-slot"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js?v=2"></script>
<script src="../js/backend.js"></script>
<script src="../js/engine.js"></script>
<script>
(function () {
  "use strict";

  // 1-D Lights Out on 5 cells: tap toggles self + neighbours.
  // All-on is solvable (tap 0&3, or 1&4 — verified). When every light
  // is off, the tiles reveal the passcode. Nothing server-side until
  // the player types it in.
  var CODE = ["Q", "U", "I", "E", "T"];

  async function boot() {
    var ok = await Thinkakain.initLevel({ level: 5, title: "Quiet Lights" });
    if (!ok) return;

    var row = document.getElementById("tiles");
    var state = [1, 1, 1, 1, 1];
    var solved = false;
    var tiles = [];

    function render() {
      for (var i = 0; i < 5; i++) {
        tiles[i].classList.toggle("lit", state[i] === 1);
        tiles[i].textContent = (solved ? CODE[i] : "");
        tiles[i].classList.toggle("reveal", solved);
        tiles[i].disabled = solved;
      }
    }

    function check() {
      for (var i = 0; i < 5; i++) {
        if (state[i] !== 0) return;
      }
      solved = true;
      render();
    }

    for (var i = 0; i < 5; i++) {
      (function (idx) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "tile";
        b.setAttribute("aria-label", "Light " + (idx + 1));
        b.addEventListener("click", function () {
          if (solved) return;
          for (var j = idx - 1; j <= idx + 1; j++) {
            if (j >= 0 && j < 5) state[j] = 1 - state[j];
          }
          render();
          check();
        });
        row.appendChild(b);
        tiles.push(b);
      })(i);
    }
    render();

    Thinkakain.mountPasscode(5, {
      successFlavor: "Darkness, decoded."
    });
  }
  boot();
})();
</script>
</body>
</html>
