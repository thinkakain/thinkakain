<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level 2 · Thinkakain</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header id="tower-header"></header>

<main id="level-main" class="level-main">

  <section class="puzzle-card">
    <div class="plaque">LEVEL 3</div>
    <div class="fake-progress">
      <div class="fake-bar"><div class="fake-fill"></div></div>
      <div class="fake-text">Progress: 2/30 levels</div>
    </div>
  </section>

  <div id="passcode-slot"></div>

  <div class="level-footer">&mdash; Level 2 &mdash;</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js?v=2"></script>
<script src="../js/backend.js"></script>
<script src="../js/engine.js"></script>
<script>
(function () {
  "use strict";

  // The page lies: the header claims "Level 3" (via levelLabel) and the
  // engine's real progress bar is hidden so the fake "2/30" bar and the
  // footer ("Level 2") can tell the truth. The real answer is checked
  // server-side; unlock logic uses the true level number (2).
  async function boot() {
    var ok = await Thinkakain.initLevel({
      level: 2,
      title: "The Wrong Number",
      levelLabel: "Level 3",
      hideProgress: true
    });
    if (!ok) return;

    Thinkakain.mountPasscode(2, {
      successFlavor: "Sharp eyes."
    });
  }
  boot();
})();
</script>
</body>
</html>
