<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level 2 · Thinkakain</title>
<link rel="stylesheet" href="../css/style.css?v=15">
</head>
<body class="black-bg">

<header id="tower-header"></header>

<main id="level-main" class="level-main">
  <section class="puzzle-card blackout">
    <div class="hidden-ink">INVISIBLE</div>
  </section>
  <div id="passcode-slot"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js?v=2"></script>
<script src="../js/backend.js"></script>
<script src="../js/engine.js"></script>
<script>
(function () {
  "use strict";
  async function boot() {
    var ok = await Thinkakain.initLevel({ level: 2 });
    if (!ok) return;
    Thinkakain.mountPasscode(2, {
      successFlavor: "Seen the unseen.",
      wrongMessage: "Not quite. Try again."
    });
  }
  boot();
})();
</script>
</body>
</html>
