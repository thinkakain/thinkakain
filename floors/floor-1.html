<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floor 1 · Overthink</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="has-ticker">

<div id="ticker" aria-hidden="true"></div>

<header id="tower-header"></header>

<main id="floor-main" class="floor-main">
  <div class="look-up-big">Look up.</div>
  <p class="center muted">That is all this floor will tell you.</p>

  <div id="hint-slot"></div>
  <div id="passcode-slot"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/backend.js"></script>
<script src="../js/engine.js"></script>
<script>
(function () {
  "use strict";

  // The code hides in two places most players never check: the ticker
  // strip at the very top of the viewport, and the browser tab title.
  // Both cycle the same word list, fetched from the server — the page
  // source contains no answers. One frame of the cycle is the passcode.
  async function boot() {
    var ok = await Overthink.initFloor({ floor: 1, title: "Look Up" });
    if (!ok) return;

    var clues = await Overthink.clues(1).catch(function () { return {}; });
    var words = (clues.ticker_words && clues.ticker_words.length)
      ? clues.ticker_words
      : ["look", "up"];

    var ticker = document.getElementById("ticker");
    var i = 0;
    function cycle() {
      var w = words[i % words.length];
      ticker.textContent = w;
      document.title = "Floor 1 · " + w; // the tab itself becomes a clue
      i++;
    }
    cycle();
    setInterval(cycle, 1200);

    Overthink.hints("hint-slot", [
      "The answer is above this page.",
      "Browser tabs have titles too — watch it cycle."
    ]);

    Overthink.mountPasscode(1, {
      successFlavor: "Keen eyes.",
      wrongMessage: "Not quite. The page is trying to tell you where to look."
    });
  }
  boot();
})();
</script>
</body>
</html>
